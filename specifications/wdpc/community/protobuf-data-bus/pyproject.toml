[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wdpc-protobuf-reference"
version = "0.1.0"
description = "Reference implementation of the GSF WDPC protobuf data model and data bus envelope."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["protobuf>=5.26"]

[project.optional-dependencies]
dev = ["pytest>=8", "grpcio-tools>=1.62"]

[tool.setuptools]
packages = ["wdpc_ref"]

[tool.pytest.ini_options]
testpaths = ["tests"]
